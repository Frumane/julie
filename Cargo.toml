[package]
name = "julie"
version = "0.1.0"
edition = "2024"
description = "Hafif ve hızlı bir web tarayıcısı (Rust + WebView2)"
license = "GPL-3.0-or-later"

[dependencies]
# Brave'in reklam engelleme motoru (EasyList biçimindeki kuralları eşleştirir).
adblock = "0.13"
serde_json = "1"
# Geçmiş ve yer imleri. `bundled`: SQLite programın içine derlenir.
rusqlite = { version = "0.43", features = ["bundled"] }
# Site ikonlarını başlangıç sayfasına gömmek ve `data:` adreslerini çözmek için.
base64 = "0.22"
x509-parser = "0.18"
sha1 = "0.10"
sha2 = "0.10"
# Gömülü geliştirici araçları paketini (zip) açmak için.
flate2 = "1"
# PDF görüntüleyici: sayfaları çizen, Rust ile yazılmış PDF motoru.
hayro = "0.9"

[target.'cfg(windows)'.dependencies]
tao = "0.37"
wry = "0.57"
# wry'nin kullandığı sürümlerle aynı olmalı (WebView2 olaylarına erişim için).
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3"
# Filtre listelerini indirmek için; TLS için Windows'un kendi kütüphanesi (SChannel).
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1"
# julie.exe'nin ikonu ve sürüm bilgisi.
winresource = "0.1"

# Sürüm derlemesi: en yüksek optimizasyon, en küçük ikili dosya.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
