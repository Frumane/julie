[package]
name = "julie"
version = "0.1.0"
edition = "2024"
description = "Hafif ve hızlı bir web tarayıcısı (Rust + WebView2)"
license = "GPL-3.0-or-later"

[dependencies]
# Brave'in reklam engelleme motoru (EasyList biçimindeki kuralları eşleştirir).
adblock = "0.13"
serde_json = "1"
# Geçmiş ve yer imleri. `bundled`: SQLite programın içine derlenir.
rusqlite = { version = "0.43", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
tao = "0.37"
# `devtools`: sürüm derlemesinde de geliştirici araçları (F12).
wry = { version = "0.57", features = ["devtools"] }
# wry'nin kullandığı sürümlerle aynı olmalı (WebView2 olaylarına erişim için).
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }
base64 = "0.22"
# Filtre listelerini indirmek için; TLS için Windows'un kendi kütüphanesi (SChannel).
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1"

# Sürüm derlemesi: en yüksek optimizasyon, en küçük ikili dosya.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
