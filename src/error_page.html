<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa açılamadı</title>
<style>
  :root {
    --bg: #f7f7f5;
    --text: #1b1b1a;
    --muted: #6b6a66;
    --faint: #a3a29c;
    --line: #dcdbd6;
    --primary: #1b1b1a;
    --on-primary: #f7f7f5;
    --danger: #c42b1c;
    --warn: #b45309;
    --stem: #3f7d5c;
    --petal: #e84393;
    --petal-2: #f8a5c2;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615;
      --text: #ecebe7;
      --muted: #a3a29c;
      --faint: #6b6a66;
      --line: #33322f;
      --primary: #ecebe7;
      --on-primary: #161615;
      --danger: #ff8a80;
      --warn: #f5b357;
      --stem: #5fae84;
      --petal: #ff6fae;
      --petal-2: #8f3a62;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  /* Sayfanın ortasında bir sütun; yazılar sütunun soluna dayalı. */
  main {
    max-width: 808px;
    margin: 0 auto;
    padding: max(48px, 16vh) 24px 48px;
  }
  .bird { display: block; width: 56px; height: 56px; margin: 0 0 22px -6px; }
  .eyebrow {
    font: 13px/1.3 "Cascadia Mono", Consolas, monospace;
    color: var(--muted);
    letter-spacing: .02em;
    overflow-wrap: anywhere;
  }
  .eyebrow b { font-weight: 600; }
  .danger .eyebrow b, .danger h1 { color: var(--danger); }
  .warn .eyebrow b { color: var(--warn); }
  h1 {
    margin: 12px 0 14px;
    font: 600 34px/1.15 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    letter-spacing: -.01em;
  }
  p { margin: 0 0 6px; color: var(--muted); max-width: 48ch; }
  .actions { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 22px; align-items: center; }
  button { font: inherit; color: var(--text); cursor: pointer; }
  .primary {
    border: 0;
    border-radius: 6px;
    padding: 9px 18px;
    background: var(--primary);
    color: var(--on-primary);
    font-weight: 600;
  }
  .link {
    border: 0;
    padding: 0;
    background: none;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .link.danger-link { color: var(--danger); }
  button:focus-visible { outline: 2px solid var(--muted); outline-offset: 3px; }
  canvas:focus-visible { outline: none; }
  .code { margin-top: 44px; font: 12px "Cascadia Mono", Consolas, monospace; color: var(--faint); }
  .more { margin-top: 18px; }
  .more[hidden] { display: none; }

  /* İnternet yokken: sinekkuşu oyunu */
  /* Chrome'daki dinozor gibi: başlığın üstünde, 600×150, arka plansız. */
  .game { margin: 0 0 30px; }
  canvas {
    display: block;
    width: 100%;
    height: 150px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    touch-action: manipulation;
  }
</style>
</head>
<body>
<main id="page">
  <svg class="bird" id="bird" viewBox="0 0 512 512" aria-hidden="true"></svg>
  <section class="game" id="game" hidden aria-label="Sinekkuşu oyunu">
    <canvas id="sky" tabindex="0" aria-label="Oyun alanı: boşluk tuşu, yukarı ok ya da tıklama ile kanat çırp"></canvas>
  </section>
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <p id="text"></p>
  <p id="note" hidden></p>
  <div class="actions" id="actions"></div>
  <div class="more" id="more" hidden></div>
  <div class="code" id="code"></div>
</main>
<script>
  // Tarayıcı bu satırı sayfayı gönderirken doldurur.
  const STATE = /*STATE*/null;
  const send = (msg) => window.ipc && window.ipc.postMessage(msg);
  const $ = (id) => document.getElementById(id);

  // Julie'nin logosu: üçgenlerden sinekkuşu (assets/logo.svg ile aynı).
  const BIRD = [
    ["#c4b5fd", "M312 170L210 34L250 156Z"], ["#ddd6fe", "M312 170L210 34L282 100Z"],
    ["#2dd4bf", "M350 126L392 148L312 170Z"], ["#14b8a6", "M392 148L394 170L312 170Z"],
    ["#0d9488", "M312 170L394 170L378 204Z"], ["#5eead4", "M392 148L492 128L393 159Z"],
    ["#0f766e", "M393 159L492 128L394 170Z"], ["#ec4899", "M312 170L378 204L318 216Z"],
    ["#db2777", "M318 216L378 204L354 262Z"], ["#7c3aed", "M318 216L354 262L262 340Z"],
    ["#6d28d9", "M318 216L262 340L236 326Z"], ["#4f46e5", "M236 326L176 428L262 340Z"],
    ["#4338ca", "M262 340L176 428L240 440Z"], ["#22d3ee", "M318 216L250 156L112 84Z"],
    ["#06b6d4", "M312 170L318 216L250 156Z"], ["#0891b2", "M318 216L214 206L112 84Z"],
  ];
  // Kanat (ilk iki üçgen) ve gövde ayrı: oyunda kanat çırpılır.
  const WING = 2;
  $("bird").innerHTML =
    '<g transform="translate(256 256) scale(.94) translate(-302 -237)">' +
    BIRD.map(([fill, d]) => `<path fill="${fill}" d="${d}"/>`).join("") +
    '<circle cx="352" cy="160" r="8" fill="#0f0d2e"/></g>';

  const kind = STATE.kind;
  const danger = kind === "cert";
  const warn = kind === "insecure";
  if (danger) $("page").classList.add("danger");
  if (warn) $("page").classList.add("warn");

  const label = { cert: "güvenlik uyarısı", insecure: "şifresiz bağlantı", blocked: "engellendi" }[kind];
  const where = STATE.host || STATE.shown;
  $("eyebrow").innerHTML = "";
  if (label) {
    const b = document.createElement("b");
    b.textContent = label;
    $("eyebrow").append(b, where ? " · " + where : "");
  } else {
    $("eyebrow").textContent = where;
  }
  $("title").textContent = STATE.title;
  $("text").textContent = STATE.text;
  document.title = STATE.title.replace(/\.$/, "");
  $("code").textContent = STATE.code;
  if (danger || warn) {
    $("note").textContent = "Şifre ya da kart bilgisi girme.";
    $("note").hidden = false;
  }

  const button = (label, primary, msg, extra) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = primary ? "primary" : "link" + (extra ? " " + extra : "");
    b.addEventListener("click", () => send(msg));
    return b;
  };
  const game = kind === "game";
  const offline = kind === "offline" || game;
  if (danger) {
    $("actions").append(button("Güvenli sayfaya dön", true, "error-back"));
    // Siteye yine de gitme seçeneği bir adım geride dursun.
    const toggle = document.createElement("button");
    toggle.className = "link";
    toggle.textContent = "Ayrıntılar";
    toggle.addEventListener("click", () => { $("more").hidden = !$("more").hidden; });
    $("actions").append(toggle);
    $("more").append(button("Riskini bilerek siteye git", false, "cert-allow:" + STATE.url, "danger-link"));
  } else if (warn) {
    $("actions").append(
      button("Geri dön", true, "insecure-back"),
      button("Yine de aç", false, "http-allow:" + STATE.url),
    );
  } else if (!game) {
    if (STATE.url) $("actions").append(button("Yeniden dene", true, "error-retry:" + STATE.url));
    $("actions").append(button("Geri dön", !STATE.url, "error-back"));
  }
  // Oyun sayfasında boşluk tuşu düğmeye değil oyuna gitsin.
  if (!offline) $("actions").querySelector("button").focus();
  if (game) {
    $("actions").hidden = true;
    $("code").hidden = true;
  }

  if (offline) {
    // SVG'de `hidden` özelliği yok; gizlemek için stil gerekir.
    $("bird").style.display = "none";
    $("game").hidden = false;
    if (STATE.url) addEventListener("online", () => send("error-retry:" + STATE.url));
    startGame($("sky"));
  }

  // ------------------------------------------------------------ oyun
  // Sinekkuşu çiçek sapları arasından uçar. Her geçilen sap bir puan.
  function startGame(canvas) {
    const ctx = canvas.getContext("2d");
    const css = getComputedStyle(document.documentElement);
    const color = (name) => css.getPropertyValue(name).trim();
    const paths = BIRD.map(([fill, d]) => [fill, new Path2D(d)]);
    const eye = new Path2D(); eye.arc(352, 160, 8, 0, Math.PI * 2);

    let W = 0, H = 0;
    const resize = () => {
      const r = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      W = r.width; H = r.height;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    addEventListener("resize", resize);

    const GRAVITY = 1100, FLAP = -290, SIZE = 34, GAP = 74, SPACING = 190;
    let best = 0;
    try { best = Number(localStorage.getItem("julie-bird-best")) || 0; } catch (_) {}
    let state, y, vy, flaps, stems, score, speed, wing, last;

    const reset = () => {
      state = "ready"; y = H / 2; vy = 0; stems = []; score = 0; speed = 150; wing = 0;
    };
    reset();

    const flap = () => {
      if (state === "over") {
        // Çarpınca hemen basılan tuş yanlışlıkla yeni oyunu başlatmasın.
        if (performance.now() - last < 350) return;
        reset();
      }
      if (state === "ready") state = "play";
      vy = FLAP; wing = 1;
    };
    canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); canvas.focus(); flap(); });
    addEventListener("keydown", (e) => {
      if (e.code !== "Space" && e.code !== "ArrowUp") return;
      if (e.target instanceof HTMLButtonElement) return;
      e.preventDefault();
      flap();
    });
    canvas.focus();

    const addStem = (x) => {
      const top = 12 + Math.random() * (H - GAP - 24);
      stems.push({ x, top, passed: false, sway: Math.random() * Math.PI * 2 });
    };

    const drawFlower = (x, y, up, t) => {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.sin(t) * 0.08);
      for (let i = 0; i < 5; i++) {
        ctx.rotate((Math.PI * 2) / 5);
        ctx.fillStyle = i % 2 ? color("--petal") : color("--petal-2");
        ctx.beginPath();
        ctx.ellipse(0, up ? -6 : 6, 4, 7, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = "#facc15";
      ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    };

    const drawStem = (s, t) => {
      ctx.strokeStyle = color("--stem");
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      // Üstten sarkan ve alttan uzanan sap; uçlarında çiçek.
      ctx.beginPath(); ctx.moveTo(s.x, -10); ctx.lineTo(s.x, s.top); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s.x, H + 10); ctx.lineTo(s.x, s.top + GAP); ctx.stroke();
      ctx.fillStyle = color("--stem");
      for (const [ly, dir] of [[s.top * 0.55, -1], [s.top + GAP + (H - s.top - GAP) * 0.45, 1]]) {
        ctx.beginPath(); ctx.ellipse(s.x + 6 * dir, ly, 6, 3, 0.5 * dir, 0, Math.PI * 2); ctx.fill();
      }
      drawFlower(s.x, s.top, false, t + s.sway);
      drawFlower(s.x, s.top + GAP, true, t + s.sway);
    };

    const drawBird = (x, y, tilt) => {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(tilt);
      const k = SIZE / 512;
      ctx.scale(k, k);
      ctx.translate(-256, -256);
      ctx.translate(256, 256); ctx.scale(0.94, 0.94); ctx.translate(-302, -237);
      paths.forEach(([fill, p], i) => {
        if (i < WING) {
          // Kanat çırparken kanat gövdeye doğru kapanıp açılır.
          ctx.save();
          ctx.translate(312, 170);
          ctx.scale(1, 1 - 0.75 * wing);
          ctx.translate(-312, -170);
          ctx.fillStyle = fill; ctx.fill(p);
          ctx.restore();
        } else {
          ctx.fillStyle = fill; ctx.fill(p);
        }
      });
      ctx.fillStyle = "#0f0d2e"; ctx.fill(eye);
      ctx.restore();
    };

    const text = (s, x, y, size, align, weight) => {
      ctx.fillStyle = color("--text");
      ctx.font = `${weight || 600} ${size}px "Segoe UI Variable Display","Segoe UI",sans-serif`;
      ctx.textAlign = align;
      ctx.fillText(s, x, y);
    };

    const BX = () => Math.min(90, W * 0.18);
    last = performance.now();
    const frame = (now) => {
      const dt = Math.min(0.033, (now - last) / 1000);
      if (state !== "over") last = now;
      const t = now / 600;
      ctx.clearRect(0, 0, W, H);

      if (state === "ready") {
        y = H / 2 + Math.sin(now / 250) * 6;
        wing = (Math.sin(now / 45) + 1) / 2;
      } else if (state === "play") {
        vy += GRAVITY * dt;
        y += vy * dt;
        wing = Math.max(0, wing - dt * 6);
        speed = Math.min(260, speed + dt * 4);
        if (!stems.length || stems[stems.length - 1].x < W - SPACING) addStem(W + 30);
        for (const s of stems) {
          s.x -= speed * dt;
          if (!s.passed && s.x < BX()) { s.passed = true; score++; }
        }
        stems = stems.filter((s) => s.x > -40);
        const r = SIZE * 0.32;
        const hit = y - r < 0 || y + r > H || stems.some((s) =>
          Math.abs(s.x - BX()) < r + 3 && (y - r < s.top + 4 || y + r > s.top + GAP - 4));
        if (hit) {
          state = "over";
          last = now;
          if (score > best) {
            best = score;
            try { localStorage.setItem("julie-bird-best", String(best)); } catch (_) {}
          }
        }
      }

      for (const s of stems) drawStem(s, t);
      const tilt = state === "play" ? Math.max(-0.45, Math.min(0.9, vy / 700)) : 0;
      drawBird(BX(), y, tilt);

      // Puan sağ üstte, Chrome'daki gibi: "EN İYİ 00012  00005".
      const pad = (n) => String(n).padStart(5, "0");
      ctx.font = '13px "Cascadia Mono", Consolas, monospace';
      ctx.textAlign = "right";
      ctx.fillStyle = color("--muted");
      ctx.fillText((best ? "EN İYİ " + pad(best) + "  " : "") + pad(score), W - 4, 16);
      if (state === "ready") {
        text("Uçmak için boşluk tuşuna bas", W / 2, H - 14, 13, "center", 400);
      }
      if (state === "over") {
        text("Çiçeğe çarptın", W / 2, H / 2 - 4, 17, "center");
        text("Yeniden uçmak için boşluk", W / 2, H / 2 + 16, 12, "center", 400);
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
</script>
</body>
</html>
