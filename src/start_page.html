<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yeni sekme</title>
<style>
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6b66;
    --border: #dcdcd6;
    --accent: #2f6fde;
    --accent-soft: #e6eefc;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a;
      --surface: #222226;
      --text: #ececea;
      --muted: #9a9a96;
      --border: #3a3a3f;
      --accent: #7aa6ff;
      --accent-soft: #263552;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  main { width: min(640px, 100%); margin-top: -12vh; }
  h1 .logo { width: 64px; height: 64px; flex: none; }
  h1 {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font: 600 44px/1 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    letter-spacing: -0.02em;
    text-align: center;
    margin: 0 0 28px;
  }
  form { display: flex; }
  input[type=search] {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 17px;
    padding: 14px 20px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    outline: none;
  }
  input[type=search]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-box { position: relative; }
  .suggest {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 6px);
    z-index: 10;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .14);
  }
  .suggest[hidden] { display: none; }
  .suggest .row {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 38px;
    padding: 0 14px;
    border-radius: 10px;
    cursor: pointer;
  }
  .suggest .row[aria-selected="true"] { background: var(--accent-soft); }
  .suggest .row:hover:not([aria-selected="true"]) { background: var(--bg); }
  .suggest .ico { width: 16px; height: 16px; flex: none; display: grid; place-items: center; color: var(--muted); }
  .suggest .ico img { width: 16px; height: 16px; }
  .suggest .title, .suggest .detail { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .suggest .title { flex: 0 1 auto; }
  .suggest .detail { flex: 1 1 0; color: var(--muted); font-size: 13px; }
  .engine-line {
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  select {
    font: inherit;
    color: var(--text);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 2px 4px;
    cursor: pointer;
  }
  select:hover, select:focus { border-color: var(--border); outline: none; }
  select option { background: var(--surface); }

  .bookmarks {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
    gap: 8px;
    margin-top: 28px;
  }
  .tile {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px 8px 12px;
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    min-width: 0;
  }
  .tile:hover, .tile:focus-visible { background: var(--surface); outline: none; }
  .tile .badge {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
    font-size: 17px;
  }
  .tile .badge img { width: 24px; height: 24px; }
  .tile .name {
    font-size: 13px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tile .remove {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 22px;
    height: 22px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    font: inherit;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
  }
  .tile:hover .remove, .tile .remove:focus-visible { opacity: 1; }
  .tile .remove:hover { background: var(--border); color: var(--text); }
  .links {
    margin-top: 14px;
    text-align: center;
    font-size: 13px;
  }
  .links a { color: var(--muted); }
  .links a:hover { color: var(--accent); }

  .safety {
    margin: 28px auto 0;
    max-width: 440px;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .safety label { display: flex; gap: 10px; align-items: center; color: var(--text); cursor: pointer; }
  .safety input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
  .safety p { margin: 6px 0 0 26px; }

  /* İlk açılış: arama motoru seçimi */
  .choose h2 { font-size: 20px; font-weight: 600; text-align: center; margin: 0 0 6px; }
  .choose p { color: var(--muted); text-align: center; margin: 0 0 22px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .grid button {
    font: inherit;
    text-align: left;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
  }
  .grid button:hover, .grid button:focus-visible { border-color: var(--accent); background: var(--accent-soft); outline: none; }
  .grid strong { display: block; font-weight: 600; }
  .grid span { display: block; color: var(--muted); font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1><svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><g transform="translate(256 256) scale(.94) translate(-302 -237)"><path fill="#c4b5fd" d="M312 170L210 34L250 156Z"/><path fill="#ddd6fe" d="M312 170L210 34L282 100Z"/><path fill="#2dd4bf" d="M350 126L392 148L312 170Z"/><path fill="#14b8a6" d="M392 148L394 170L312 170Z"/><path fill="#0d9488" d="M312 170L394 170L378 204Z"/><path fill="#5eead4" d="M392 148L492 128L393 159Z"/><path fill="#0f766e" d="M393 159L492 128L394 170Z"/><path fill="#ec4899" d="M312 170L378 204L318 216Z"/><path fill="#db2777" d="M318 216L378 204L354 262Z"/><path fill="#7c3aed" d="M318 216L354 262L262 340Z"/><path fill="#6d28d9" d="M318 216L262 340L236 326Z"/><path fill="#4f46e5" d="M236 326L176 428L262 340Z"/><path fill="#4338ca" d="M262 340L176 428L240 440Z"/><path fill="#22d3ee" d="M318 216L250 156L112 84Z"/><path fill="#06b6d4" d="M312 170L318 216L250 156Z"/><path fill="#0891b2" d="M318 216L214 206L112 84Z"/><circle cx="352" cy="160" r="8" fill="#0f0d2e"/></g></svg>Julie</h1>

  <section class="choose" id="choose" hidden>
    <h2>Arama motorunu seç</h2>
    <p>Adres çubuğundan ve bu sayfadan yaptığın aramalar bununla yapılır. Sonra buradan değiştirebilirsin.</p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="search" hidden>
    <div class="search-box">
      <form id="form" autocomplete="off">
        <input type="search" id="q" placeholder="Ara ya da adres yaz" aria-label="Ara ya da adres yaz"
               role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false">
      </form>
      <div class="suggest" id="suggest" role="listbox" aria-label="Öneriler" hidden></div>
    </div>
    <div class="engine-line">
      <label for="engine">Arama motoru:</label>
      <select id="engine"></select>
    </div>
    <nav class="bookmarks" id="bookmarks" aria-label="Yer imleri" hidden></nav>
    <div class="links"><a href="http://julie.history/">Geçmiş (Ctrl+H)</a> · <a href="http://julie.settings/">Görünüm ve ayarlar (Ctrl+,)</a></div>
    <div class="safety">
      <label><input type="checkbox" id="smartscreen"> Zararlı site koruması (Microsoft SmartScreen)</label>
      <p>Açıkken ziyaret ettiğin adresler, tehlikeli olup olmadıklarının kontrolü için Microsoft'a gönderilir.</p>
    </div>
  </section>
</main>
<script>
  // Tarayıcı bu satırı sayfayı gönderirken doldurur.
  const STATE = /*STATE*/null;

  const send = (msg) => window.ipc && window.ipc.postMessage(msg);
  const $ = (id) => document.getElementById(id);

  function showSearch() {
    $("choose").hidden = true;
    $("search").hidden = false;
    $("engine").value = STATE.selected;
    $("q").focus();
  }

  function choose(id) {
    STATE.selected = id;
    send("engine:" + id);
    showSearch();
  }

  for (const e of STATE.engines) {
    const button = document.createElement("button");
    button.type = "button";
    button.innerHTML = "<strong></strong><span></span>";
    button.querySelector("strong").textContent = e.name;
    button.querySelector("span").textContent = e.note;
    button.addEventListener("click", () => choose(e.id));
    $("grid").append(button);

    $("engine").append(new Option(e.name, e.id));
  }

  $("engine").addEventListener("change", (ev) => {
    STATE.selected = ev.target.value;
    send("engine:" + ev.target.value);
    $("q").focus();
  });

  // Yer imleri: Ctrl+D ya da araç çubuğundaki yıldızla eklenir.
  const isWeb = (url) => /^https?:\/\//i.test(url);
  for (const b of STATE.bookmarks) {
    if (!isWeb(b.url)) continue;
    const host = new URL(b.url).hostname.replace(/^www\./, "");
    const tile = document.createElement("a");
    tile.className = "tile";
    tile.href = b.url;
    tile.title = (b.title || host) + "\n" + b.url;
    tile.innerHTML = '<span class="badge"></span><span class="name"></span>' +
      '<button type="button" class="remove" aria-label="Yer imini sil">×</button>';
    const badge = tile.querySelector(".badge");
    if (b.icon) {
      const img = document.createElement("img");
      img.src = b.icon;
      img.alt = "";
      badge.append(img);
    } else {
      badge.textContent = (b.title || host).trim().charAt(0).toUpperCase();
    }
    tile.querySelector(".name").textContent = b.title || host;
    tile.querySelector(".remove").addEventListener("click", (ev) => {
      ev.preventDefault();
      send("bookmark-remove:" + b.url);
      tile.remove();
      if (!$("bookmarks").children.length) $("bookmarks").hidden = true;
    });
    $("bookmarks").append(tile);
  }
  $("bookmarks").hidden = $("bookmarks").children.length === 0;

  $("smartscreen").checked = STATE.smartscreen;
  $("smartscreen").addEventListener("change", (ev) => {
    send("smartscreen:" + (ev.target.checked ? "on" : "off"));
  });

  // Öneriler: kutuya yazdıkça tarayıcıdan istenir, gelince kutunun altında
  // listelenir. İlk satır Enter'a basınca olacak şeydir.
  const q = $("q");
  const list = $("suggest");
  let rows = [];
  let sel = 0;
  const SEARCH_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>';
  const GLOBE_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c-3.5 3.5-3.5 13.5 0 17M12 3.5c3.5 3.5 3.5 13.5 0 17"/></svg>';

  function hideSuggest() {
    list.hidden = true;
    rows = [];
    q.setAttribute("aria-expanded", "false");
  }

  function drawSuggest() {
    list.replaceChildren();
    rows.forEach((r, i) => {
      const row = document.createElement("div");
      row.className = "row";
      row.id = "s" + i;
      row.setAttribute("role", "option");
      row.setAttribute("aria-selected", i === sel ? "true" : "false");
      const ico = document.createElement("span");
      ico.className = "ico";
      if (r.icon) {
        const img = document.createElement("img");
        img.src = r.icon;
        img.alt = "";
        ico.append(img);
      } else {
        ico.innerHTML = r.search ? SEARCH_ICON : GLOBE_ICON;
      }
      const title = document.createElement("span");
      title.className = "title";
      title.textContent = r.title;
      const detail = document.createElement("span");
      detail.className = "detail";
      detail.textContent = r.detail;
      row.append(ico, title, detail);
      // mousedown: kutu odağı kaybedip listeyi kapatmadan seç.
      row.addEventListener("mousedown", (ev) => {
        ev.preventDefault();
        choose(i);
      });
      list.append(row);
    });
    list.hidden = rows.length === 0;
    q.setAttribute("aria-expanded", list.hidden ? "false" : "true");
    q.setAttribute("aria-activedescendant", list.hidden ? "" : "s" + sel);
  }

  function choose(i) {
    const text = i === 0 ? q.value.trim() : rows[i].target;
    hideSuggest();
    if (text) send("go:" + text);
  }

  window.julieSuggestions = (query, items) => {
    if (q.value !== query || document.activeElement !== q) return;
    const keep = rows[sel] && items[sel] && rows[sel].target === items[sel].target;
    rows = items;
    if (!keep) sel = 0;
    drawSuggest();
  };

  q.addEventListener("input", () => {
    if (!q.value.trim()) return hideSuggest();
    send("suggest:" + q.value);
  });
  q.addEventListener("keydown", (ev) => {
    if (list.hidden) return;
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      sel = Math.max(0, Math.min(rows.length - 1, sel + (ev.key === "ArrowDown" ? 1 : -1)));
      drawSuggest();
    } else if (ev.key === "Escape") {
      ev.preventDefault();
      hideSuggest();
    }
  });
  q.addEventListener("blur", hideSuggest);

  $("form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    if (!list.hidden && sel > 0) return choose(sel);
    hideSuggest();
    const text = q.value.trim();
    if (text) send("go:" + text);
  });

  if (STATE.selected) {
    showSearch();
  } else {
    $("choose").hidden = false;
    $("grid").querySelector("button").focus();
  }
</script>
</body>
</html>
