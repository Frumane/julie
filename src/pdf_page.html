<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF</title>
<style>
  :root {
    --bg: #ecebf0;
    --bar: #f8f8fa;
    --surface: #ffffff;
    --text: #1f1d2b;
    --muted: #5d5a70;
    --faint: #8a879a;
    --border: #dcdae4;
    --hover: #e6e4ee;
    --accent: #5b4bd6;
    --accent-soft: #e8e5f6;
    --placeholder: #f3f2f6;
    --shadow: 0 1px 3px rgba(20, 18, 40, .14), 0 4px 14px rgba(20, 18, 40, .08);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --bar: #1d1d21;
      --surface: #26262b;
      --text: #ececea;
      --muted: #a3a09f;
      --faint: #7c7a80;
      --border: #34333a;
      --hover: #2e2d34;
      --accent: #9b8fff;
      --accent-soft: #2c2850;
      --placeholder: #2a2a30;
      --shadow: 0 1px 3px rgba(0, 0, 0, .5), 0 6px 18px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  header {
    position: fixed;
    inset: 0 0 auto 0;
    height: 46px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px 0 14px;
    background: var(--bar);
    border-bottom: 1px solid var(--border);
    z-index: 2;
  }
  .name {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }
  .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name svg { flex: none; color: #d13b2f; }
  .group { display: flex; align-items: center; gap: 2px; }
  .middle { flex: none; }
  .right { flex: 1 1 0; justify-content: flex-end; }
  .sep { width: 1px; height: 20px; background: var(--border); margin: 0 6px; }
  button {
    font: inherit;
    color: var(--text);
    background: transparent;
    border: 0;
    border-radius: 6px;
    height: 30px;
    min-width: 30px;
    padding: 0 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
  }
  button:hover { background: var(--hover); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled { color: var(--faint); cursor: default; background: transparent; }
  button svg { flex: none; }
  button.text { color: var(--muted); white-space: nowrap; }
  input.page {
    font: inherit;
    width: 44px;
    height: 26px;
    text-align: center;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-variant-numeric: tabular-nums;
  }
  .count { color: var(--muted); padding: 0 4px 0 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .zoom { min-width: 52px; font-variant-numeric: tabular-nums; }
  #viewer {
    position: fixed;
    inset: 46px 0 0 0;
    overflow: auto;
    outline: none;
  }
  #pages {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 18px 24px 40px;
    width: max-content;
    min-width: 100%;
  }
  .p {
    position: relative;
    background: var(--placeholder);
    box-shadow: var(--shadow);
    flex: none;
  }
  .p img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #fff;
    user-select: none;
    -webkit-user-drag: none;
  }
  .p .num {
    position: absolute;
    inset: 50% 0 auto 0;
    transform: translateY(-50%);
    text-align: center;
    color: var(--faint);
    font-size: 15px;
  }
  .message {
    position: fixed;
    inset: 46px 0 0 0;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 10px;
    text-align: center;
    padding: 24px;
  }
  .message strong { font-size: 16px; }
  .message p { margin: 0; color: var(--muted); max-width: 440px; }
  .message button { border: 1px solid var(--border); background: var(--surface); height: 34px; padding: 0 16px; margin-top: 6px; }
  .message button:hover { border-color: var(--accent); }
  .spinner {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #print { display: none; }
  [hidden] { display: none !important; }
  @media (max-width: 860px) {
    #edge { display: none; }
  }
  @media (max-width: 720px) {
    .label { display: none; }
    .name span { display: none; }
  }
  @media print {
    @page { margin: 0; }
    html, body { height: auto; overflow: visible; background: #fff; }
    header, #viewer, .message { display: none !important; }
    #print { display: block; }
    #print img { display: block; width: 100%; height: auto; break-after: page; }
    #print img:last-child { break-after: auto; }
  }
</style>
</head>
<body>
<header>
  <div class="name" title="">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V9h5.5z" opacity=".9"/><text x="12" y="18.5" text-anchor="middle" font-size="6.2" font-weight="700" fill="#fff" font-family="Segoe UI, sans-serif">PDF</text></svg>
    <span id="name"></span>
  </div>
  <div class="group middle">
    <input class="page" id="page" type="text" inputmode="numeric" aria-label="Sayfa" value="1">
    <span class="count" id="count">/ 1</span>
    <div class="sep"></div>
    <button type="button" id="out" title="Uzaklaştır (Ctrl −)" aria-label="Uzaklaştır">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button type="button" class="zoom" id="zoom" title="Yakınlaştırmayı sıfırla (Ctrl 0)">100%</button>
    <button type="button" id="in" title="Yakınlaştır (Ctrl +)" aria-label="Yakınlaştır">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button type="button" id="fit" title="Sayfaya sığdır">
      <svg id="fit-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="3.5" y="1.5" width="9" height="13" rx="1"/><path d="M6 6.5 8 4.5l2 2M6 9.5l2 2 2-2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="group right">
    <button type="button" id="save" title="Kaydet (Ctrl+S)">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8.5M4.5 7.5 8 11l3.5-3.5M2.5 13.5h11"/></svg>
      <span class="label">Kaydet</span>
    </button>
    <button type="button" id="print-button" title="Yazdır (Ctrl+P)">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M4.5 5.5v-3h7v3"/><rect x="1.5" y="5.5" width="13" height="6" rx="1.2"/><path d="M4.5 9.5h7v4h-7z"/></svg>
      <span class="label">Yazdır</span>
    </button>
    <div class="sep"></div>
    <button type="button" class="text" id="edge" title="Form doldurma, not alma ve şifreli PDF'ler için">Diğer görüntüleyici</button>
  </div>
</header>

<div id="viewer" tabindex="0"><div id="pages"></div></div>

<div class="message" id="loading">
  <div class="spinner" aria-hidden="true"></div>
  <p>PDF açılıyor…</p>
</div>
<div class="message" id="error" hidden>
  <strong id="error-title">PDF açılamadı</strong>
  <p id="error-text"></p>
  <button type="button" id="error-edge">Diğer görüntüleyiciyle aç</button>
</div>
<div class="message" id="printing" hidden>
  <div class="spinner" aria-hidden="true"></div>
  <p id="printing-text">Yazdırmaya hazırlanıyor…</p>
</div>
<div id="print"></div>

<script>
  "use strict";
  const STATE = /*STATE*/null;
  const $ = (id) => document.getElementById(id);
  const send = (msg) => window.ipc && window.ipc.postMessage(msg);
  // 1 punto = 96/72 CSS pikseli: %100'de PDF gerçek boyutunda görünür.
  const PT = 96 / 72;
  const ZOOMS = [0.25, 0.33, 0.5, 0.67, 0.75, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3, 4, 5];
  const viewer = $("viewer");
  const pagesBox = $("pages");
  const memoryKey = "julie-pdf:" + STATE.src;

  let info = null;       // { doc, name, title, pages: [[w, h], ...] }
  let pages = [];        // { box, img, scale, loading }
  let zoom = 1;          // CSS ölçeği (1 = %100)
  let fit = "width";     // "width", "page" ya da null (elle)
  let current = 0;

  function showError(title, text) {
    $("loading").hidden = true;
    $("error-title").textContent = title;
    $("error-text").textContent = text;
    $("error").hidden = false;
    viewer.hidden = true;
  }

  function openInEdge() { send("pdf-edge:" + STATE.src); }
  $("edge").addEventListener("click", openInEdge);
  $("error-edge").addEventListener("click", openInEdge);

  async function load() {
    $("name").textContent = STATE.name;
    $("name").parentElement.title = STATE.src;
    document.title = STATE.name;
    if (!STATE.src) {
      showError("PDF bulunamadı", "Açılacak bir PDF adresi yok.");
      return;
    }
    let reply = null;
    try {
      const q = "src=" + encodeURIComponent(STATE.src) + (STATE.doc ? "&doc=" + STATE.doc : "");
      const res = await fetch("/info?" + q, { cache: "no-store" });
      reply = await res.json();
    } catch {}
    if (reply && reply.missing) {
      // Belge bellekte yok (sekme yeniden açıldı ya da uzun süre geçti):
      // PDF'i yeniden aç; Julie onu yakalayıp buraya geri getirir. Döngüye
      // girmemek için yalnızca bir kez.
      const key = "julie-pdf-retry:" + STATE.src;
      let tried = false;
      try { tried = sessionStorage.getItem(key) === "1"; sessionStorage.setItem(key, "1"); } catch {}
      if (!tried) {
        location.replace(STATE.src);
        return;
      }
      showError("PDF açılamadı", "Dosya yeniden yüklenemedi. Diğer görüntüleyiciyle açmayı deneyebilirsin.");
      return;
    }
    if (!reply || reply.error) {
      const text = reply && reply.error === "encrypted"
        ? "Bu PDF şifreli. Julie'nin görüntüleyicisi şifreli PDF'leri henüz açamıyor."
        : "Dosya bozuk olabilir ya da Julie'nin görüntüleyicisi bu PDF'i okuyamadı.";
      showError("PDF açılamadı", text);
      return;
    }
    try { sessionStorage.removeItem("julie-pdf-retry:" + STATE.src); } catch {}
    info = reply;
    if (info.title) document.title = info.title;
    $("count").textContent = "/ " + info.pages.length;
    build();
    $("loading").hidden = true;
    let saved = 0;
    try { saved = parseInt(localStorage.getItem(memoryKey) || "0", 10) || 0; } catch {}
    const hash = /#page=(\d+)/.exec(STATE.src);
    if (hash) saved = parseInt(hash[1], 10) - 1;
    layout();
    if (saved > 0 && saved < pages.length) goTo(saved, false);
    viewer.focus();
    update();
  }

  function build() {
    pagesBox.replaceChildren();
    pages = info.pages.map((size, i) => {
      const box = document.createElement("div");
      box.className = "p";
      const num = document.createElement("div");
      num.className = "num";
      num.textContent = i + 1;
      box.append(num);
      pagesBox.append(box);
      return { box, img: null, scale: 0, loading: false, size };
    });
  }

  function widest() { return Math.max(...info.pages.map(([w]) => w)); }
  function tallest() { return Math.max(...info.pages.map(([, h]) => h)); }

  function fitZoom(mode) {
    const w = viewer.clientWidth - 48;
    const h = viewer.clientHeight - 36;
    if (mode === "page") return Math.min(w / (widest() * PT), h / (tallest() * PT));
    return Math.min(w / (widest() * PT), 2.5);
  }

  // Sayfa kutularının boyutu; resimler yeni ölçekte yeniden istenir.
  function layout() {
    if (!info) return;
    if (fit) zoom = Math.max(0.1, fitZoom(fit));
    for (const p of pages) {
      p.box.style.width = Math.round(p.size[0] * PT * zoom) + "px";
      p.box.style.height = Math.round(p.size[1] * PT * zoom) + "px";
    }
    $("zoom").textContent = Math.round(zoom * 100) + "%";
    $("fit").title = fit === "page" ? "Genişliğe sığdır" : "Sayfaya sığdır";
    $("out").disabled = zoom <= ZOOMS[0] + 0.001;
    $("in").disabled = zoom >= ZOOMS[ZOOMS.length - 1] - 0.001;
  }

  // Görünen sayfayı koruyarak yakınlaştır.
  function setZoom(next, anchorY) {
    if (!info) return;
    next = Math.min(ZOOMS[ZOOMS.length - 1], Math.max(ZOOMS[0], next));
    const y = anchorY ?? viewer.clientHeight / 2;
    const ratio = (viewer.scrollTop + y) / Math.max(1, pagesBox.scrollHeight);
    const xRatio = (viewer.scrollLeft + viewer.clientWidth / 2) / Math.max(1, pagesBox.scrollWidth);
    fit = null;
    zoom = next;
    layout();
    viewer.scrollTop = ratio * pagesBox.scrollHeight - y;
    viewer.scrollLeft = xRatio * pagesBox.scrollWidth - viewer.clientWidth / 2;
    scheduleUpdate();
  }

  function step(dir) {
    const list = dir > 0 ? ZOOMS : [...ZOOMS].reverse();
    const next = list.find((z) => (dir > 0 ? z > zoom + 0.001 : z < zoom - 0.001));
    if (next) setZoom(next);
  }

  function setFit(mode) {
    const page = current;
    fit = mode;
    layout();
    goTo(page, false);
    scheduleUpdate();
  }

  $("in").addEventListener("click", () => step(1));
  $("out").addEventListener("click", () => step(-1));
  $("zoom").addEventListener("click", () => setFit("width"));
  $("fit").addEventListener("click", () => setFit(fit === "page" ? "width" : "page"));

  function goTo(index, smooth) {
    const p = pages[Math.max(0, Math.min(pages.length - 1, index))];
    if (!p) return;
    viewer.scrollTo({ top: p.box.offsetTop - 12, behavior: smooth ? "smooth" : "auto" });
  }

  const pageInput = $("page");
  pageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const n = parseInt(pageInput.value, 10);
      if (n >= 1 && n <= pages.length) goTo(n - 1, false);
      else pageInput.value = current + 1;
      viewer.focus();
    } else if (e.key === "Escape") {
      pageInput.value = current + 1;
      viewer.focus();
    }
  });
  pageInput.addEventListener("focus", () => pageInput.select());
  pageInput.addEventListener("blur", () => { pageInput.value = current + 1; });

  // Ekranda (ve hemen yanında) görünen sayfaların resmi istenir; uzaktaki
  // sayfaların resmi bellekten atılır.
  let pending = 0;
  const MAX_PENDING = 3;
  function update() {
    if (!info) return;
    const top = viewer.scrollTop;
    const bottom = top + viewer.clientHeight;
    const margin = viewer.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    const wanted = Math.round(zoom * PT * dpr * 100) / 100;
    let center = 0, best = Infinity;
    const queue = [];
    pages.forEach((p, i) => {
      const y = p.box.offsetTop, h = p.box.offsetHeight;
      const mid = Math.abs(y + h / 2 - (top + viewer.clientHeight / 2));
      if (mid < best) { best = mid; center = i; }
      const near = y + h > top - margin && y < bottom + margin;
      const far = y + h < top - 4 * margin || y > bottom + 4 * margin;
      if (near && Math.abs(p.scale - wanted) > 0.01) queue.push({ p, i, d: mid });
      if (far && p.img) {
        p.img.remove();
        p.img = null;
        p.scale = 0;
      }
    });
    if (center !== current) {
      current = center;
      remember();
    }
    if (document.activeElement !== pageInput) pageInput.value = current + 1;
    queue.sort((a, b) => a.d - b.d);
    for (const { p, i } of queue) {
      if (pending >= MAX_PENDING) break;
      if (!p.loading) request(p, i, wanted);
    }
  }

  function request(p, i, scale) {
    p.loading = true;
    pending++;
    const img = new Image();
    img.alt = "";
    img.decoding = "async";
    img.onload = () => {
      // Eski resim yenisi gelene kadar (bulanık da olsa) yerinde kalır.
      if (p.img) p.img.remove();
      p.img = img;
      p.scale = scale;
      p.box.append(img);
      done();
    };
    img.onerror = () => { p.scale = scale; done(); };
    const done = () => { p.loading = false; pending--; scheduleUpdate(); };
    img.src = "/page?doc=" + info.doc + "&n=" + i + "&s=" + scale;
  }

  let frame = 0;
  function scheduleUpdate() {
    if (frame) return;
    frame = requestAnimationFrame(() => { frame = 0; update(); });
  }
  viewer.addEventListener("scroll", scheduleUpdate, { passive: true });
  window.addEventListener("resize", () => {
    if (fit) { const page = current; layout(); goTo(page, false); }
    scheduleUpdate();
  });

  let memoryTimer = 0;
  function remember() {
    clearTimeout(memoryTimer);
    memoryTimer = setTimeout(() => {
      try { localStorage.setItem(memoryKey, String(current)); } catch {}
    }, 400);
  }

  // Ctrl + tekerlek: imlecin olduğu yeri koruyarak yakınlaştır.
  viewer.addEventListener("wheel", (e) => {
    if (!e.ctrlKey || !info) return;
    e.preventDefault();
    const factor = Math.exp(-e.deltaY / 400);
    const rect = viewer.getBoundingClientRect();
    setZoom(zoom * factor, e.clientY - rect.top);
  }, { passive: false });

  // Kaydet: dosya gerçek adıyla Julie'nin indirmelerine iner.
  async function save() {
    if (!info) return;
    let blob;
    try {
      const res = await fetch("/file?doc=" + info.doc, { cache: "no-store" });
      if (!res.ok) throw new Error();
      blob = await res.blob();
    } catch {
      showError("Kaydedilemedi", "Belge artık bellekte değil; sayfayı yenileyip tekrar dene.");
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = info.name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  }
  $("save").addEventListener("click", save);

  // Yazdır: bütün sayfalar yazıcıya uygun çözünürlükte hazırlanır.
  let printing = false;
  async function print() {
    if (!info || printing) return;
    printing = true;
    const box = $("print");
    box.replaceChildren();
    $("printing").hidden = false;
    let ready = 0;
    const total = pages.length;
    const text = $("printing-text");
    const load = (i) => new Promise((resolve) => {
      const img = new Image();
      img.onload = img.onerror = () => {
        ready++;
        text.textContent = "Yazdırmaya hazırlanıyor… " + ready + " / " + total;
        resolve(img);
      };
      img.src = "/page?doc=" + info.doc + "&n=" + i + "&s=2";
    });
    const images = [];
    for (let i = 0; i < total; i += 4) {
      const batch = [];
      for (let j = i; j < Math.min(total, i + 4); j++) batch.push(load(j));
      images.push(...await Promise.all(batch));
    }
    box.append(...images);
    $("printing").hidden = true;
    setTimeout(() => {
      window.print();
      box.replaceChildren();
      printing = false;
    }, 50);
  }
  $("print-button").addEventListener("click", print);

  document.addEventListener("keydown", (e) => {
    const ctrl = e.ctrlKey || e.metaKey;
    const key = e.key.toLowerCase();
    if (ctrl && key === "s") { e.preventDefault(); save(); return; }
    if (ctrl && key === "p") { e.preventDefault(); print(); return; }
    if (ctrl && (key === "+" || key === "=")) { e.preventDefault(); step(1); return; }
    if (ctrl && key === "-") { e.preventDefault(); step(-1); return; }
    if (ctrl && key === "0") { e.preventDefault(); setFit("width"); return; }
    if (e.target === pageInput || !info) return;
    if (key === "home") { e.preventDefault(); goTo(0, false); }
    else if (key === "end") { e.preventDefault(); goTo(pages.length - 1, false); }
    else if ((key === "arrowright" || key === "arrowleft") && viewer.scrollWidth <= viewer.clientWidth) {
      e.preventDefault();
      goTo(current + (key === "arrowright" ? 1 : -1), false);
    }
  });

  load();
</script>
</body>
</html>
