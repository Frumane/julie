<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sertifika</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1b1b1a;
    --muted: #6b6a66;
    --faint: #a3a29c;
    --line: #e4e3de;
    --accent: #1b1b1a;
    --danger: #c42b1c;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615;
      --card: #1e1e1d;
      --text: #ecebe7;
      --muted: #a3a29c;
      --faint: #6b6a66;
      --line: #2e2d2b;
      --accent: #ecebe7;
      --danger: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 880px; margin: 0 auto; padding: 48px 24px 64px; }
  h1 {
    margin: 0 0 24px;
    font: 600 28px/1.2 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 28px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 28px;
  }
  .tabs button {
    font: inherit;
    font-size: 14px;
    color: var(--muted);
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 8px 0 10px;
    margin-bottom: -1px;
    cursor: pointer;
    max-width: 36ch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] {
    color: var(--text);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--muted); outline-offset: 3px; }
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 18px 22px 16px;
    margin-bottom: 14px;
  }
  h2 {
    margin: 0 0 12px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .02em;
    color: var(--muted);
  }
  dl {
    display: grid;
    grid-template-columns: minmax(150px, 30%) 1fr;
    gap: 6px 24px;
    margin: 0;
  }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  dd.mono { font: 12.5px/1.6 "Cascadia Mono", Consolas, monospace; }
  dd .bad { color: var(--danger); font-weight: 600; }
  a { color: var(--text); text-underline-offset: 3px; }
  .sep { color: var(--faint); margin: 0 8px; }
  .empty { color: var(--muted); }
  @media (max-width: 560px) {
    dl { grid-template-columns: 1fr; gap: 2px; }
    dd { margin-bottom: 8px; }
  }
</style>
</head>
<body>
<main>
  <h1>Sertifika</h1>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div id="body"></div>
</main>
<script>
  // Tarayıcı bu satırı sayfayı gönderirken doldurur.
  const STATE = /*STATE*/null;
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };
  const when = (secs) => new Date(secs * 1000).toLocaleString("tr-TR", {
    day: "numeric", month: "long", year: "numeric",
    hour: "2-digit", minute: "2-digit", second: "2-digit", timeZoneName: "short",
  });
  const download = (name, text) => {
    const a = el("a", "", name);
    a.href = "data:application/x-pem-file;charset=utf-8," + encodeURIComponent(text);
    a.download = name.replace(/[^\w.-]+/g, "_") + ".pem";
    return a;
  };

  function show(index) {
    const cert = STATE.certs[index];
    [...$("tabs").children].forEach((b, i) => b.setAttribute("aria-selected", i === index));
    const body = $("body");
    body.replaceChildren();
    const now = Date.now() / 1000;
    for (const s of cert.sections) {
      const sec = el("section");
      sec.append(el("h2", "", s.title));
      const dl = el("dl");
      for (const r of s.rows) {
        const dd = el("dd", r.mono ? "mono" : "");
        if (r.time !== undefined) {
          dd.textContent = when(r.time);
          if (r.k === "Bitiş" && r.time < now) dd.append(el("span", "bad", " · süresi dolmuş"));
          if (r.k === "Başlangıç" && r.time > now) dd.append(el("span", "bad", " · henüz geçerli değil"));
        } else if (r.download) {
          dd.append(download("PEM (sertifika)", cert.pem));
          if (STATE.certs.length > 1) {
            dd.append(el("span", "sep", "·"), download("PEM (zincir)", STATE.chain));
          }
        } else {
          dd.textContent = r.v;
        }
        dl.append(el("dt", "", r.k), dd);
      }
      sec.append(dl);
      body.append(sec);
    }
    document.title = "Sertifika: " + cert.label;
  }

  if (!STATE.certs.length) {
    $("body").append(el("p", "empty", "Gösterilecek sertifika yok."));
  } else {
    STATE.certs.forEach((cert, i) => {
      const b = el("button", "", cert.label);
      b.setAttribute("role", "tab");
      b.title = cert.label;
      b.addEventListener("click", () => show(i));
      $("tabs").append(b);
    });
    show(0);
  }
</script>
</body>
</html>
