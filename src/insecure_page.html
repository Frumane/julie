<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Güvenli bağlantı yok</title>
<style>
  :root {
    --bg: #f6f5f9;
    --surface: #ffffff;
    --text: #1f1d2b;
    --muted: #5d5a70;
    --border: #e0dee8;
    --accent: #5b4bd6;
    --warn: #b45309;
    --warn-soft: #fdf0dc;
    --on-accent: #ffffff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a;
      --surface: #222226;
      --text: #ececea;
      --muted: #a3a09f;
      --border: #38373d;
      --accent: #9b8fff;
      --warn: #f5b357;
      --warn-soft: #3a2a12;
      --on-accent: #17171a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  main {
    width: min(560px, 100%);
    padding: 32px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: var(--warn-soft);
    color: var(--warn);
  }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: var(--muted); }
  .host { font-weight: 600; color: var(--text); word-break: break-all; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  button {
    font: inherit;
    height: 36px;
    padding: 0 16px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button:hover { filter: brightness(0.96); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>
  </div>
  <h1>Bu site güvenli bağlantı desteklemiyor</h1>
  <p><span class="host" id="host"></span> şifreli (HTTPS) olarak açılamadı. Devam edersen bu sitede gönderdiğin ve gördüğün her şey, aynı ağdaki başkaları tarafından okunabilir ya da değiştirilebilir.</p>
  <p>Şifre, kart bilgisi gibi özel bilgileri bu sitede girme.</p>
  <div class="actions">
    <button class="primary" id="back" autofocus>Geri dön</button>
    <button id="continue">Yine de devam et</button>
  </div>
</main>
<script>
  // Tarayıcı bu satırı sayfayı gönderirken doldurur.
  const STATE = /*STATE*/null;
  const send = (msg) => window.ipc && window.ipc.postMessage(msg);
  document.getElementById("host").textContent = STATE.host;
  document.getElementById("back").addEventListener("click", () => send("insecure-back"));
  document.getElementById("continue").addEventListener("click", () => send("http-allow:" + STATE.url));
</script>
</body>
</html>
