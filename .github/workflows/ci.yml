name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Biçim kontrolü
        run: cargo fmt --check

      - name: Clippy (uyarılar hata sayılır)
        run: cargo clippy --all-targets -- -D warnings

      - name: Testler
        run: cargo test

      - name: Sürüm derlemesi
        run: cargo build --release

      - name: İkili dosya boyutu
        shell: pwsh
        run: |
          $size = (Get-Item target/release/julie.exe).Length / 1MB
          "julie.exe: {0:N2} MB" -f $size | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: julie-windows-x64
          path: target/release/julie.exe
          retention-days: 14
