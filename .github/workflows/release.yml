name: Release

# `v0.1.0` gibi bir etiket gönderildiğinde Windows'ta sürümü derler ve
# GitHub'da sürüm sayfasını oluşturur.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Testler
        run: cargo test

      - name: Sürüm derlemesi
        run: cargo build --release

      - name: Paketle
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/julie.exe dist/
          Copy-Item LICENSE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "julie-${{ github.ref_name }}-windows-x64.zip"

      - uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: julie-${{ github.ref_name }}-windows-x64.zip
