name: Release

# GitHub'da yeni bir sürüm yayımlandığında (Releases → "Draft a new
# release", etiket ör. `v0.2.0`) Windows'ta julie.exe'yi derler ve sürüm
# sayfasına ekler. Sürüm numarası etiketten alınır.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Sürüm numarası
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Etiket v1.2.3 biçiminde olmalı: $env:TAG" }
          "JULIE_VERSION=$($env:TAG.Substring(1))" | Out-File -Append $env:GITHUB_ENV

      - name: Testler
        run: cargo test --release

      - name: Sürüm derlemesi
        run: cargo build --release

      - name: Sürüme ekle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:TAG target/release/julie.exe --clobber
